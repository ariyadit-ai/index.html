    }
    function now() { return new Date().toISOString(); }
    function thaiDate(value) { return new Date(value).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}); }
    function esc(text){ const d=document.createElement('div');d.textContent=text||'';return d.innerHTML; }
    function showLoadError(){ showView('load-error'); }
    const handler = { onDataChanged(data) { clearTimeout(initialLoadTimer); backendRecords = data; renderIssue(); renderStock(); renderHistory(); } };
    async function initializeDataSdk() {
      clearTimeout(initialLoadTimer);
      initialLoadTimer=setTimeout(showLoadError,8000);
      const result=await window.dataSdk.init(handler);
      if(!result.isOk){clearTimeout(initialLoadTimer);showLoadError();}
    }
    function setPending(control,pending,label){control.disabled=pending;control.classList.toggle('opacity-60',pending); if(pending) control.dataset.original=control.textContent, control.textContent='กำลังบันทึก...'; else if(control.dataset.original) control.textContent=control.dataset.original;}
    async function saveMovement(action, product, qty, reason, user) {
      return await window.dataSdk.create({record_type:'movement',barcode:product.barcode,sku:product.sku,size:product.size,category:product.category,quantity:qty,status:product.status||'Cont',action,reason:reason||'',user:user||'',date:now(),created_at:now()});
    }
    async function beginTransaction(action){ currentAction=action; $('worker-form').reset(); showView('user-name'); }
    $('worker-form').addEventListener('submit',e=>{e.preventDefault();workerName=$('worker-name').value.trim();showView(currentAction==='receive'?'receive':'issue');if(currentAction==='issue')renderIssue();});
    $('admin-login-form').addEventListener('submit',e=>{e.preventDefault();showView('admin-home');});
    $('product-form').addEventListener('submit',async e=>{
      e.preventDefault(); const btn=e.submitter, barcode=$('new-barcode').value.trim(), sku=$('new-sku').value.trim(), size=$('new-size').value.trim();
      if(!/^\d{13}$/.test(barcode)) return toast('กรุณากรอกบาร์โค้ดให้ครบ 13 หลัก','error');
      if(products().some(p=>p.barcode===barcode)) return toast('บาร์โค้ดนี้มีอยู่แล้ว','error');
      setPending(btn,true);
      try {
        const product={record_type:'product',barcode,sku,size,category:$('new-category').value,quantity:0,status:'Cont',action:'',reason:'',user:'',date:'',created_at:now()};
        const r=await window.dataSdk.create(product);
        if(!r.isOk) return toast('ไม่สามารถยืนยันการบันทึกได้','error');
        await saveMovement('เพิ่มสินค้า',product,0,'', 'ผู้ดูแล');
        $('product-form').reset();toast('บันทึกสำเร็จ');showView('admin-home');
      } finally {setPending(btn,false);}
    });
    $('receive-search').addEventListener('input',()=>{
      const q=$('receive-search').value.toLowerCase(); selectedReceiveId='';
      const match=products().filter(p=>p.sku.toLowerCase().includes(q)).slice(0,6); const box=$('sku-suggestions');
      box.innerHTML=match.length&&q?match.map(p=>`<button type="button" class="block w-full text-left px-4 py-3 hover:bg-[#f8f2e8]" data-id="${p.__backendId}">${esc(p.sku)} · ${esc(p.size)} · ${esc(p.barcode)}</button>`).join(''):''; box.classList.toggle('hidden',!box.innerHTML);
      box.querySelectorAll('button').forEach(b=>b.onclick=()=>{const p=products().find(x=>x.__backendId===b.dataset.id);selectedReceiveId=p.__backendId;$('receive-search').value=`${p.sku} · ${p.size}`;box.classList.add('hidden');});
    });
    $('receive-form').addEventListener('submit',async e=>{
      e.preventDefault();const btn=e.submitter,p=products().find(x=>x.__backendId===selectedReceiveId),q=Number($('receive-quantity').value);
      if(!p) return toast('กรุณาเลือกสินค้าจากรายการ','error'); if(q<1)return;
      setPending(btn,true);try{const update=await window.dataSdk.update({...p,quantity:p.quantity+q});if(!update.isOk)return toast('ไม่สามารถยืนยันการบันทึกได้','error');await saveMovement('รับเข้า',p,q,'',workerName);$('receive-form').reset();selectedReceiveId='';toast('บันทึกสำเร็จ');}finally{setPending(btn,false)}});
    function renderIssue(){
      const q=($('issue-search')?.value||'').toLowerCase();
      const list=products().filter(p=>p.category==='normal'&&(`${p.sku} ${p.barcode} ${p.size}`).toLowerCase().includes(q)).sort((a,b)=>a.sku.localeCompare(b.sku)||a.size.localeCompare(b.size));
      $('issue-list').innerHTML=list.length?`<table><thead><tr><th>บาร์โค้ด</th><th>SKU</th><th>ไซส์</th><th>คงเหลือ</th><th>จำนวนตัดออก</th><th>เหตุผล</th><th>หน่วย</th><th></th></tr></thead><tbody>${list.map(p=>`<tr data-id="${p.__backendId}"><td>${esc(p.barcode)}</td><td class="font-semibold">${esc(p.sku)}</td><td>${esc(p.size)}</td><td>${p.quantity}</td><td><input aria-label="จำนวนตัดออก" type="number" min="1" max="${p.quantity}" class="issue-qty w-20 rounded-lg border p-2" style="border-color:#dcc6a6"></td><td><select aria-label="เหตุผล" class="issue-reason rounded-lg border p-2" style="border-color:#dcc6a6"><option>ขาย</option><option>PR</option><option>Show</option><option>เข้าห้าง</option></select></td><td>ชิ้น</td><td><button type="button" class="issue-save rounded-lg px-3 py-2 text-white text-sm" style="background:#b54943">บันทึก</button></td></tr>`).join('')}</tbody></table>`:emptyHTML();
      document.querySelectorAll('.issue-save').forEach(b=>b.onclick=()=>issueProduct(b));
    }
    $('issue-search').addEventListener('input',renderIssue);
    $('stock-search').addEventListener('input',renderStock);
    async function issueProduct(btn){const row=btn.closest('tr'),p=products().find(x=>x.__backendId===row.dataset.id),q=Number(row.querySelector('.issue-qty').value),reason=row.querySelector('.issue-reason').value;if(!q||q<1)return toast('กรุณาระบุจำนวน','error');if(q>p.quantity)return toast('จำนวนตัดออกมากกว่าคงเหลือ','error');setPending(btn,true);try{const r=await window.dataSdk.update({...p,quantity:p.quantity-q});if(!r.isOk)return toast('ไม่สามารถยืนยันการบันทึกได้','error');await saveMovement('ตัดออก',p,q,reason,workerName);toast('บันทึกสำเร็จ')}finally{setPending(btn,false)}}
    function showStock(category){window.stockCategory=category;$('stock-heading').textContent=category==='normal'?'เช็คสต็อก':'สินค้าตำหนิ';$('stock-helper').textContent=category==='normal'?'รายการสินค้างานปกติทั้งหมด':'รายการสินค้าหมวดงานตำหนิทั้งหมด';renderStock();showView('stock');}
    function renderStock(){if(!window.stockCategory)return;const q=($('stock-search')?.value||'').trim().toLowerCase();const latest=backendRecords.map(r=>r.date||r.created_at).filter(Boolean).sort((a,b)=>new Date(b)-new Date(a))[0];$('stock-updated-value').textContent=latest?thaiDate(latest):'ยังไม่มีข้อมูล';const list=products().filter(p=>p.category===window.stockCategory&&(!q||p.sku.toLowerCase().includes(q))).sort((a,b)=>a.sku.localeCompare(b.sku)||a.size.localeCompare(b.size));$('stock-list').innerHTML=list.length?`<table><thead><tr><th>บาร์โค้ด</th><th>SKU</th><th>ไซส์</th><th>คงเหลือ</th>${window.stockCategory==='normal'?'<th>สถานะสินค้า</th>':'<th>ตัดออก</th>'}<th>จัดการ</th></tr></thead><tbody>${list.map(p=>`<tr data-id="${p.__backendId}"><td>${esc(p.barcode)}</td><td class="font-semibold">${esc(p.sku)}</td><td>${esc(p.size)}</td><td>${p.quantity} ชิ้น</td>${window.stockCategory==='normal'?`<td><button class="status-btn rounded-full px-3 py-1 text-sm text-white" style="background:${p.status==='Dis'?'#b54943':'#3d7a57'}">${p.status||'Cont'}</button></td>`:`<td><button class="defect-issue rounded-lg px-3 py-2 text-white text-sm" style="background:#b54943">ตัดออก 1 ชิ้น</button></td>`}<td><button class="delete-btn text-sm underline text-[#b54943]">ลบสินค้า</button></td></tr>`).join('')}</tbody></table>`:emptyHTML();
      document.querySelectorAll('.status-btn').forEach(b=>b.onclick=()=>toggleStatus(b));document.querySelectorAll('.delete-btn').forEach(b=>b.onclick=()=>deleteProduct(b));document.querySelectorAll('.defect-issue').forEach(b=>b.onclick=()=>defectIssue(b));
    }
    async function toggleStatus(btn){const p=products().find(x=>x.__backendId===btn.closest('tr').dataset.id);const r=await window.dataSdk.update({...p,status:p.status==='Dis'?'Cont':'Dis'});if(!r.isOk)toast('เปลี่ยนสถานะไม่สำเร็จ','error');}
    async function defectIssue(btn){const p=products().find(x=>x.__backendId===btn.closest('tr').dataset.id);if(p.quantity<1)return toast('สินค้าไม่คงเหลือ','error');setPending(btn,true);try{const r=await window.dataSdk.update({...p,quantity:p.quantity-1});if(!r.isOk)return toast('ตัดออกไม่สำเร็จ','error');await saveMovement('ตัดออก',p,1,'นำออกไปใช้','');toast('บันทึกสำเร็จ')}finally{setPending(btn,false)}}
    async function deleteProduct(btn){if(btn.dataset.confirm!=='yes'){btn.dataset.confirm='yes';btn.textContent='ยืนยันการลบ';return;}const p=products().find(x=>x.__backendId===btn.closest('tr').dataset.id);setPending(btn,true);try{const r=await window.dataSdk.delete(p);if(!r.isOk)return toast('ลบสินค้าไม่สำเร็จ','error');await saveMovement('ลบสินค้า',p,p.quantity,'','ผู้ดูแล');toast('ลบข้อมูลสินค้าแล้ว')}finally{setPending(btn,false)}}
    function openHistory(){renderHistory();showView('history');}
    $('history-filter').addEventListener('submit',e=>{e.preventDefault();renderHistory();});
    function getFilteredHistory(){const action=$('history-action')?.value||'',date=$('history-date')?.value||'';return movements().filter(m=>(!action||m.action===action)&&(!date||m.date.startsWith(date))).sort((a,b)=>new Date(b.date)-new Date(a.date));}
    function renderHistory(){const list=getFilteredHistory();$('history-list').innerHTML=list.length?`<table><thead><tr><th>ประเภท</th><th>วันที่</th><th>สินค้า</th><th>จำนวน</th><th>เหตุผล</th><th>ผู้ทำรายการ</th></tr></thead><tbody>${list.map(m=>`<tr><td>${esc(m.action)}</td><td>${thaiDate(m.date)}</td><td>${esc(m.sku)} · ${esc(m.size)}</td><td>${m.quantity} ชิ้น</td><td>${esc(m.reason||'-')}</td><td>${esc(m.user||'-')}</td></tr>`).join('')}</tbody></table>`:emptyHTML();}
    function downloadHistoryPDF(){
      const list=getFilteredHistory();
      if(!list.length)return toast('ไม่มีข้อมูลประวัติสำหรับดาวน์โหลด','error');
      if(!window.jspdf||!window.jspdf.jsPDF)return toast('ไม่สามารถโหลดระบบสร้าง PDF ได้ กรุณาตรวจสอบอินเทอร์เน็ต','error');
      const btn=$('history-pdf-button');setPending(btn,true);
      try{
        const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
        doc.setFontSize(18);doc.text('Stock Movement History',14,16);
        doc.setFontSize(10);doc.text(`ประเภท: ${$('history-action').value||'ทุกประเภท'}    วันที่: ${$('history-date').value||'ทุกวัน'}`,14,23);
        doc.text(`จำนวนรายการ: ${list.length}`,14,29);
        doc.autoTable({startY:34,head:[['ประเภท','วันที่','สินค้า','จำนวน','เหตุผล','ผู้ทำรายการ']],body:list.map(m=>[m.action||'-',new Date(m.date).toLocaleDateString('th-TH'),`${m.sku||'-'} · ${m.size||'-'}`,`${Number(m.quantity)||0} ชิ้น`,m.reason||'-',m.user||'-']),theme:'grid',styles:{font:'helvetica',fontSize:9,cellPadding:2.5},headStyles:{fontStyle:'bold'},margin:{left:14,right:14}});
        doc.save(`ประวัติสต๊อก_${$('history-date').value||'ทั้งหมด'}_${new Date().toISOString().slice(0,10)}.pdf`);
        toast('ดาวน์โหลด PDF สำเร็จ');
      }catch(error){console.error(error);toast('สร้างไฟล์ PDF ไม่สำเร็จ','error');}
      finally{setPending(btn,false);}
    }
    function emptyHTML(){return '<div class="p-8 text-center text-sm opacity-60">ยังไม่มีข้อมูล</div>';}
    document.addEventListener('DOMContentLoaded',()=>{lucide.createIcons();initializeDataSdk();});
  </script>
 </body>
</html>
